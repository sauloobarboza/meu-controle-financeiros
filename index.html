<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="./manifest.webmanifest"><title>Meu Controle</title>
<style>
:root{--bg:#f4f6fa;--ink:#182230;--muted:#687386;--line:#e6eaf0;--blue:#315efb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif}header{background:#111827;color:white;padding:20px 16px;border-radius:0 0 22px 22px}h1{font-size:21px;margin:0}header small{color:#c3ccda}main{max-width:900px;margin:15px auto;padding:0 11px 40px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}.muted{color:var(--muted);font-size:12px}.balance{font-size:29px;font-weight:800;margin:3px 0 12px}.filters{display:flex;gap:8px}.filters select{flex:1}input,select,button{font:inherit;min-height:44px;border-radius:10px;padding:9px 11px;border:1px solid var(--line);background:white;color:inherit}button{font-weight:650;cursor:pointer}.primary{background:var(--blue);color:white;border:0}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.search{width:100%;margin:12px 0}.month-head{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr);align-items:center;gap:5px;margin:15px 0 7px;padding:10px 9px;background:#e9eefc;border:1px solid #dce4fb;border-radius:12px}.month-name{font-size:12px;font-weight:850;text-transform:uppercase;line-height:1.2}.month-total{min-width:0;text-align:right;font-size:10px;color:#5e687b}.month-total b{display:block;font-size:12px;color:#182230;white-space:nowrap}.month-total input{width:100%;min-width:0;height:30px;min-height:30px;padding:3px 4px;text-align:right;font-size:12px;font-weight:750;border-color:#d9e0ef}.wrap{overflow:hidden;background:white;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;table-layout:fixed}th{font-size:10px;text-transform:uppercase;color:#667185;background:#f8f9fc;text-align:left;padding:9px 6px}th:nth-child(1){width:43%}th:nth-child(2){width:27%;text-align:right}th:nth-child(3){width:30%;text-align:right}td{padding:5px;border-top:1px solid var(--line);min-width:0}td input{width:100%;min-width:0;border-color:transparent;padding:7px 3px;font-size:12px}td.money input{text-align:right}td.acc{text-align:right;font-weight:750;font-size:12px;white-space:normal;overflow-wrap:anywhere}td:first-child input{overflow-wrap:anywhere} .initial td{font-size:11px}tr.selected{background:#f1f4ff;outline:2px solid #9eb0ff;outline-offset:-2px}.initial{background:#f1f4fb;font-weight:700}.hide{display:none}.note{font-size:11px;color:var(--muted)}dialog{border:0;border-radius:16px;width:min(430px,calc(100% - 24px));padding:18px}dialog::backdrop{background:#11182788}.field{display:block;margin:12px 0}.field span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field select{width:100%}.modal-actions{display:flex;gap:8px;margin-top:16px}.modal-actions>*{flex:1}@media(min-width:650px){.actions{grid-template-columns:repeat(4,1fr)}}
</style></head><body><header><h1>Meu Controle</h1><small>Controle financeiro do seu jeito</small></header><main>
<section class="card"><div class="muted">Valor acumulado do mês selecionado</div><div class="balance" id="monthBalance">R$ 0,00</div><div class="filters"><select id="monthFilter" aria-label="Filtrar mês"></select><button id="newMonth">＋ Mês</button></div></section>
<input class="search" id="search" type="search" placeholder="Pesquisar conta (ex.: MER, mercado...)">
<div class="actions"><button class="primary" id="addExpense">＋ Nova despesa</button><button class="primary" id="addIncome">＋ Entrada do mês</button><button id="deleteRow">Excluir linha</button><button id="hideIncome">Ocultar entrada</button></div><div id="ledger"></div><p class="note">Toque em uma linha para selecioná-la. Edite os campos diretamente. O acumulado é recalculado automaticamente.</p></main>
<dialog id="entryDialog"><form id="entryForm"><h3 id="dialogTitle">Nova despesa</h3><label class="field"><span>Inserir abaixo de</span><select id="anchor"></select></label><label class="field"><span>Conta / descrição</span><input id="description" required placeholder="Ex.: Mercado"></label><label class="field" id="expenseField"><span>Valor da conta (R$)</span><input id="expenseValue" inputmode="decimal" placeholder="0,00"></label><label class="field" id="incomeField"><span>Valor de entrada (R$)</span><input id="incomeValue" inputmode="decimal" placeholder="0,00"></label><div class="modal-actions"><button type="button" id="cancelEntry">Cancelar</button><button class="primary">Adicionar</button></div></form></dialog>
<dialog id="monthDialog"><form id="monthForm"><h3>Novo mês</h3><label class="field"><span>Mês</span><input id="monthName" required placeholder="Ex.: Dezembro de 2026"></label><div class="modal-actions"><button type="button" id="cancelMonth">Cancelar</button><button class="primary">Criar seção</button></div></form></dialog>
<script>
const DB='meu-controle-financeiro',STORE='appState',KEY='meu-controle-financeiro-v1';let db,data,selected=null,hideIncome=false,mode='expense';
const uid=()=>Math.random().toString(36).slice(2,10),brl=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(n)||0),fmt=n=>Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function money(v){let s=String(v||'').trim().replace(/[R$\s]/g,'');if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');let n=Number(s);return Number.isFinite(n)?n:0}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function defaultData(){return{initial:2500,months:[{id:'demo-nov-2026',key:'2026-11',label:'Novembro de 2026',income:5000,rows:[{id:uid(),name:'Aluguel',expense:1200},{id:uid(),name:'Mercado',expense:850},{id:uid(),name:'Internet',expense:160},{id:uid(),name:'Água',expense:90}]},{id:'demo-dec-2026',key:'2026-12',label:'Dezembro de 2026',income:4800,rows:[{id:uid(),name:'Aluguel',expense:1450},{id:uid(),name:'Mercado',expense:900},{id:uid(),name:'Internet',expense:180},{id:uid(),name:'Água',expense:120}]}]}}
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function load(){return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).get('main');r.onsuccess=()=>res(r.result?.value||null);r.onerror=()=>rej(r.error)})}
function persist(){return new Promise((res,rej)=>{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put({id:'main',value:data,updatedAt:new Date().toISOString()});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function save(){await persist();render()}
function balances(){let p=Number(data.initial)||0,o={};data.months.forEach(m=>{p+=Number(m.income)||0;o[m.id]=m.rows.map(r=>p=p-(Number(r.expense)||0));o['end'+m.id]=p});return o}
function month(id){return data.months.find(m=>m.id===id)}
function updateFilter(){let f=document.getElementById('monthFilter'),old=f.value;f.innerHTML='';data.months.forEach(m=>{let o=document.createElement('option');o.value=m.id;o.textContent=m.label;f.append(o)});f.value=data.months.some(m=>m.id===old)?old:(data.months.at(-1)?.id||'')}
function render(){updateFilter();let b=balances(),cur=month(document.getElementById('monthFilter').value);document.getElementById('monthBalance').textContent=brl(cur?b['end'+cur.id]:data.initial);let q=document.getElementById('search').value.trim().toLocaleLowerCase('pt-BR'),out='';data.months.forEach((m,mi)=>{let rows=m.rows.map((r,i)=>({...r,acc:b[m.id][i]})).filter(r=>!q||r.name.toLocaleLowerCase('pt-BR').includes(q));if(q&&!rows.length)return;let spent=m.rows.reduce((s,r)=>s+(Number(r.expense)||0),0);out+='<div class="month-head"><div class="month-name">'+esc(m.label)+'</div><label class="month-total '+(hideIncome?'hide':'')+'">ENTRADA<input data-kind="month-income" data-month="'+m.id+'" inputmode="decimal" value="'+fmt(m.income||0)+'"></label><div class="month-total">GASTO NO MÊS<b>'+brl(spent)+'</b></div></div><div class="wrap"><table><thead><tr><th>Despesa / conta</th><th>Valor gasto</th><th>Acumulado</th></tr></thead><tbody>';if(!q&&mi===0)out+='<tr class="initial '+(selected?.month===m.id&&selected.row==='initial'?'selected':'')+'" data-month="'+m.id+'" data-row="initial"><td>Saldo inicial</td><td class="money"><input data-kind="initial" inputmode="decimal" value="'+fmt(data.initial)+'" aria-label="Saldo inicial"></td><td class="acc">'+brl(data.initial)+'</td></tr>';rows.forEach(r=>{out+='<tr class="'+(selected?.month===m.id&&selected.row===r.id?'selected':'')+'" data-month="'+m.id+'" data-row="'+r.id+'"><td><input data-field="name" data-id="'+r.id+'" value="'+esc(r.name)+'" aria-label="Descrição da despesa"></td><td class="money"><input data-field="expense" data-id="'+r.id+'" inputmode="decimal" value="'+fmt(r.expense)+'" aria-label="Valor gasto"></td><td class="acc">'+brl(r.acc)+'</td></tr>'});if(!rows.length)out+='<tr><td colspan="3" style="padding:18px;text-align:center;color:#687386">Nenhuma despesa encontrada.</td></tr>';out+='</tbody></table></div>'});document.getElementById('ledger').innerHTML=out||'<div class="card">Nenhuma conta encontrada.</div>'}
function openEntry(t){mode=t;let m=month(document.getElementById('monthFilter').value);if(!m)return;let a=document.getElementById('anchor');a.innerHTML='<option value="start">Início desta seção</option>';m.rows.forEach(r=>{let o=document.createElement('option');o.value=r.id;o.textContent=r.name||'Sem descrição';a.append(o)});if(selected?.month===m.id&&selected.row!=='initial')a.value=selected.row;document.getElementById('dialogTitle').textContent=t==='expense'?'Nova despesa':'Adicionar entrada ao mês';document.getElementById('anchor').closest('.field').classList.toggle('hide',t==='income');document.getElementById('description').closest('.field').classList.toggle('hide',t==='income');document.getElementById('expenseField').classList.toggle('hide',t!=='expense');document.getElementById('incomeField').classList.toggle('hide',t!=='income');document.getElementById('description').required=t==='expense';document.getElementById('description').value='';document.getElementById('expenseValue').value='';document.getElementById('incomeValue').value='';document.getElementById('entryDialog').showModal()}
document.getElementById('monthFilter').onchange=render;document.getElementById('search').oninput=render;document.getElementById('addExpense').onclick=()=>openEntry('expense');document.getElementById('addIncome').onclick=()=>openEntry('income');
document.getElementById('hideIncome').onclick=e=>{hideIncome=!hideIncome;e.target.textContent=hideIncome?'Mostrar entrada':'Ocultar entrada';document.querySelectorAll('.month-total').forEach(x=>{if(x.textContent.includes('ENTRADA'))x.classList.toggle('hide',hideIncome)});render()};
document.getElementById('ledger').addEventListener('click',e=>{let tr=e.target.closest('tr[data-row]');if(!tr)return;selected={month:tr.dataset.month,row:tr.dataset.row};document.querySelectorAll('tr[data-row]').forEach(x=>x.classList.toggle('selected',x===tr))});
document.getElementById('ledger').addEventListener('change',async e=>{let x=e.target;if(x.dataset.kind==='initial'){data.initial=money(x.value);await save();return}if(x.dataset.kind==='month-income'){let m=month(x.dataset.month);if(m){m.income=money(x.value);await save()}return}let f=x.dataset.field;if(!f)return;let r=month(x.closest('tr').dataset.month).rows.find(z=>z.id===x.dataset.id);if(r){r[f]=f==='name'?x.value:money(x.value);await save()}});
document.getElementById('ledger').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input'))e.target.blur()});
document.getElementById('entryForm').onsubmit=async e=>{e.preventDefault();let m=month(document.getElementById('monthFilter').value);if(mode==='income'){m.income=(Number(m.income)||0)+money(document.getElementById('incomeValue').value);document.getElementById('entryDialog').close();await save();return}let a=document.getElementById('anchor').value,row={id:uid(),name:document.getElementById('description').value.trim(),expense:money(document.getElementById('expenseValue').value)};if(!row.name)return;let i=a==='start'?-1:m.rows.findIndex(r=>r.id===a);m.rows.splice(i+1,0,row);selected={month:m.id,row:row.id};document.getElementById('entryDialog').close();await save()};
document.getElementById('deleteRow').onclick=async()=>{if(!selected||selected.row==='initial'){alert('Selecione uma linha para excluir.');return}let m=month(selected.month),i=m.rows.findIndex(r=>r.id===selected.row);if(i>=0&&confirm('Excluir '+m.rows[i].name+'?')){m.rows.splice(i,1);selected=null;await save()}};
document.getElementById('cancelEntry').onclick=()=>document.getElementById('entryDialog').close();document.getElementById('newMonth').onclick=()=>document.getElementById('monthDialog').showModal();document.getElementById('cancelMonth').onclick=()=>document.getElementById('monthDialog').close();
document.getElementById('monthForm').onsubmit=async e=>{e.preventDefault();let label=document.getElementById('monthName').value.trim();if(!label)return;let id=uid();data.months.push({id,key:'custom-'+id,label,rows:[]});document.getElementById('monthDialog').close();document.getElementById('monthName').value='';document.getElementById('monthFilter').value=id;await save()};
(async()=>{try{db=await openDB();let old=await load();if(old){data=old;data.months.forEach(m=>{if(typeof m.income!=='number'){m.income=(m.rows||[]).reduce((s,r)=>s+(Number(r.income)||0),0);(m.rows||[]).forEach(r=>r.income=0)}});let empty=(Number(data.initial)||0)===0&&data.months.length===1&&data.months[0].rows.length===0&&(Number(data.months[0].income)||0)===0;if(empty)data=defaultData();await persist()}else{try{let legacy=JSON.parse(localStorage.getItem(KEY));if(legacy){data=legacy;data.months.forEach(m=>{m.income=(m.rows||[]).reduce((s,r)=>s+(Number(r.income)||0),0);(m.rows||[]).forEach(r=>r.income=0)});localStorage.removeItem(KEY)}}catch{}data=data||defaultData();await persist()}render()}catch(err){console.error(err);document.getElementById('ledger').textContent='Não foi possível abrir o IndexedDB. Use o endereço HTTPS do GitHub Pages.'}})();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
</script></body></html>
